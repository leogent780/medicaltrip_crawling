<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>서울 에스테틱 크롤러</title>
<style>
  body { font-family: -apple-system, "Malgun Gothic", sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 20px; }
  fieldset { border: 1px solid #ddd; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; }
  legend { padding: 0 6px; color: #555; font-size: 13px; }
  label.region { display: inline-block; width: 90px; margin: 4px 0; }
  input[type="text"], input[type="number"] { padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; }
  button { padding: 10px 18px; background: #03c75a; color: white; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
  button:disabled { background: #aaa; cursor: not-allowed; }
  #log { background: #111; color: #ddd; font-family: monospace; font-size: 12px; height: 260px; overflow-y: auto; padding: 10px; border-radius: 6px; white-space: pre-wrap; margin-top: 16px; }
  #download { display: none; margin-top: 12px; }
  .error { color: #c0392b; margin-top: 8px; }
</style>
</head>
<body>
<h1>서울 에스테틱 크롤러</h1>

<fieldset>
  <legend>지역 (주요 지역 선택 또는 직접 입력)</legend>
  {% for r in major_regions %}
  <label class="region"><input type="checkbox" name="region" value="{{ r }}" checked> {{ r }}</label>
  {% endfor %}
  <div style="margin-top:8px;">
    <label>추가 지역(콤마로 구분): <input type="text" id="custom_regions" placeholder="예: 이태원, 잠실" style="width:260px;"></label>
  </div>
</fieldset>

<fieldset>
  <legend>검색 옵션</legend>
  <label>키워드: <input type="text" id="keyword" value="에스테틱" style="width:120px;"></label>
  &nbsp;&nbsp;
  <label>지역당 개수: <input type="number" id="max_count" value="15" min="1" max="100" style="width:70px;"></label>
</fieldset>
<p style="font-size:13px; color:#777;">네이버 지도 화면이 아니라 네이버 오픈 API로 조회해서 캡차가 뜨지 않는다.
crawler/.env 에 발급받은 API 키가 설정돼 있어야 동작한다.</p>

<button id="start">크롤링 시작</button>
<span id="status" style="margin-left:10px; color:#666;"></span>
<div class="error" id="error"></div>

<div id="log"></div>
<a id="download" href="#" download>
  <button type="button">엑셀 다운로드</button>
</a>

<script>
const startBtn = document.getElementById('start');
const logEl = document.getElementById('log');
const statusEl = document.getElementById('status');
const errorEl = document.getElementById('error');
const downloadEl = document.getElementById('download');

let pollTimer = null;

function appendLogs(lines) {
  for (const line of lines) {
    logEl.textContent += line + "\n";
  }
  logEl.scrollTop = logEl.scrollHeight;
}

async function poll(jobId, fromIndex) {
  const res = await fetch(`/status/${jobId}`);
  const data = await res.json();
  if (data.error) {
    errorEl.textContent = data.error;
    startBtn.disabled = false;
    clearInterval(pollTimer);
    return;
  }
  const newLines = data.logs.slice(fromIndex);
  appendLogs(newLines);
  fromIndex = data.logs.length;

  if (data.status === 'done') {
    statusEl.textContent = '완료';
    startBtn.disabled = false;
    downloadEl.href = `/download/${jobId}`;
    downloadEl.style.display = 'inline-block';
    clearInterval(pollTimer);
  } else if (data.status === 'error') {
    statusEl.textContent = '오류 발생';
    startBtn.disabled = false;
    clearInterval(pollTimer);
  } else {
    statusEl.textContent = '실행 중...';
  }
  pollTimer._fromIndex = fromIndex;
}

startBtn.addEventListener('click', async () => {
  errorEl.textContent = '';
  logEl.textContent = '';
  downloadEl.style.display = 'none';
  startBtn.disabled = true;
  statusEl.textContent = '시작하는 중...';

  const regions = Array.from(document.querySelectorAll('input[name="region"]:checked')).map(el => el.value);
  const body = {
    regions,
    custom_regions: document.getElementById('custom_regions').value,
    keyword: document.getElementById('keyword').value,
    max_count: document.getElementById('max_count').value,
  };

  const res = await fetch('/crawl', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (data.error) {
    errorEl.textContent = data.error;
    startBtn.disabled = false;
    return;
  }

  let fromIndex = 0;
  pollTimer = setInterval(() => poll(data.job_id, pollTimer._fromIndex || 0), 1500);
  pollTimer._fromIndex = 0;
});
</script>
</body>
</html>
